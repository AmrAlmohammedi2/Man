name: Build ManagerMan APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find the latest source archive or existing project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local search_root="$1"
            while IFS= read -r -d '' settings_file; do
              local candidate
              candidate="$(dirname "$settings_file")"
              if [[ -f "$candidate/app/build.gradle.kts" || -f "$candidate/app/build.gradle" ]] \
                 && [[ -f "$candidate/app/src/main/AndroidManifest.xml" ]]; then
                realpath "$candidate"
                return 0
              fi
            done < <(
              find "$search_root" \
                -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
                -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print0
            )
            return 1
          }

          PROJECT_DIR=""
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -iname 'ManagerMan*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2- || true)"

          # Prefer the newest ManagerMan source archive so older checked-in copies cannot override it.
          if [[ -n "$ZIP_FILE" ]]; then
            EXTRACT_DIR="$RUNNER_TEMP/managerman-source"
            mkdir -p "$EXTRACT_DIR"
            echo "Extracting newest source archive: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"
            PROJECT_DIR="$(find_project "$EXTRACT_DIR" || true)"
          fi

          # If no source archive is present, build an already-extracted project.
          if [[ -z "$PROJECT_DIR" ]]; then
            PROJECT_DIR="$(find_project "$GITHUB_WORKSPACE" || true)"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android project not found. Upload the newest ManagerMan source ZIP to the repository root, or commit the extracted Android project."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "Building Android project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle.kts" || test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManagerMan-v0.2.1-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
